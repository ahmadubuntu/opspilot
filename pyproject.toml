[project]
name = "opspilot"
version = "0.1.0-alpha"
description = "AI-first DevOps platform powered by MCP."
readme = "README.md"
authors = [
    { name = "Ahmad Abdolmaleki", email = "a.abdolmaleki@charisma.tech" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"


dependencies = [
    "typer>=0.16.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "structlog>=25.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
]

[project.scripts]
opspilot = "opspilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
